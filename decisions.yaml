# Decision Manifest do claude-brain
#
# Decisões subjetivas sobre o próprio cérebro (não sobre projetos de empresa).
# Schema por entrada:
#   id: D### (sequencial)
#   date: YYYY-MM-DD
#   topic: string curta (≤ 60 chars)
#   chosen: o que foi decidido
#   rejected: alternativas consideradas
#   why: razão
#   superseded_by: D### (opcional)
#
# /brain-memory:preserve adiciona aqui quando o aprendizado for uma decisão.

decisions:
  - id: D001
    date: 2026-10-24
    topic: nome e visibilidade do repositório
    chosen: Franek-G/claude-brain, público
    rejected:
      - dotclaude (genérico demais, colide com outros)
      - repositório privado
    why: público instala em qualquer máquina sem credencial e força a disciplina do PRIVACY.md; o conteúdo é método, não dado

  - id: D002
    date: 2026-10-24
    topic: licença
    chosen: MIT
    rejected:
      - Apache-2.0
    why: mesma licença dos repositórios de onde mais se aproveitou padrão (ecc, superpowers); sem cláusula de patente para um repo de configuração

  - id: D003
    date: 2026-10-24
    topic: idioma
    chosen: nomes de plugin/skill/agente/hook em inglês; corpo das skills e docs em pt-BR
    rejected:
      - tudo em inglês
      - tudo em pt-BR
    why: nomes em inglês passam no portão "portátil" do RULER; o corpo em pt-BR é a língua em que eu penso e já escrevi os comandos originais

  - id: D004
    date: 2026-10-24
    topic: forma de distribuição
    chosen: marketplace de plugins do Claude Code + script para a camada ~/.claude
    rejected:
      - clonar o repo inteiro em ~/.claude (padrão dotfiles)
      - instalador npm próprio
    why: mecanismo oficial, fixável por tag, sem rodar pacote de terceiro em máquina de empresa; plugin não distribui rules/settings, daí o script

  - id: D005
    date: 2026-10-24
    topic: o que entra na Fase 1
    chosen: brain-core (gdp, writing-skills) e brain-memory (resume, compress, preserve, hook Stop)
    rejected:
      - agentes de revisão (planner, code-reviewer) já na Fase 1
      - hooks de bloqueio (brain-guard) já na Fase 1
    why: só o que já é usado há meses entra sem passar pelo portão "usado?"; o resto está em docs/BACKLOG.md com gatilho

  - id: D006
    date: 2026-10-24
    topic: plugins de stack (AWS, Databricks) e onde ficam
    chosen: plugins oficiais de stack instalados em escopo project no repo da empresa; no cérebro só entram notas de referência datadas em docs/references/
    rejected:
      - instalar aws-core/databricks em escopo user junto com o cérebro
      - escrever skills próprias de AWS/Databricks já agora
    why: a stack é da empresa e muda a cada emprego; os plugins oficiais são mantidos pela AWS e pela Databricks; skill própria só depois de doer duas vezes (RULER)

  - id: D007
    date: 2026-10-24
    topic: o que colher do vault de time da empresa atual
    chosen: só padrões reescritos (regras de dados e agentes, moldes de skill, gitleaks, lições Databricks, modelos de vault e de plataforma de conhecimento); plugins ficam no backlog até a segunda dor
    rejected:
      - portar o guardrail de SQL e o executor dbx.py como plugin já agora
      - copiar skills e agentes do vault com os nomes e caminhos de lá
    why: RULER. As regras já doeram duas vezes (incidentes de 17/09, 30/09 e 05/10); os plugins só doeram numa empresa. Nada literal sai de repositório privado da empresa

  - id: D008
    date: 2026-10-24
    topic: critério de entrada de extensões de VS Code no repo
    chosen: entra em .vscode/extensions.json o que serve ao conteúdo do repo (Markdown, shell, YAML, JSON, Python, git) ou à stack de dados que o cérebro acompanha; cada ID conferido na API do Marketplace com lastUpdated recente
    rejected:
      - copiar as listas de "melhores extensões" de blog
      - só o núcleo, deixando a stack de dados em escopo de projeto da empresa
      - Copilot, Prettier, ESLint, Live Server, Thunder Client e extensões sem atualização há mais de dois anos
    why: popularidade não é critério (vscode-docker tem 53M de instalações e é pacote vazio desde 2025-05); a stack de dados é a que acompanha a carreira, então vale recomendar aqui; Copilot concorre com o Claude Code no mesmo painel
